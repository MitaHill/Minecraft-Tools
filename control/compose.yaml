services:
  control:
    build: .
    ports:
      - "127.0.0.1:${CONTROL_HTTP_PORT:-8765}:8000"
    environment:
      CONTROL_DATA_DIR: /data
      CONTROL_RELEASE_DIR: ${CONTROL_RELEASE_DIR:-/data/releases}
      CONTROL_LOBBY_TARGETS: ${CONTROL_LOBBY_TARGETS:-}
      CONTROL_LOBBY_BLOCKWORDS_FILE: ${CONTROL_LOBBY_BLOCKWORDS_FILE:-}
      CONTROL_ADMIN_USERS_FILE: ${CONTROL_ADMIN_USERS_FILE:-}
      FORWARDED_ALLOW_IPS: ${CONTROL_TRUSTED_PROXIES:-127.0.0.1}
    volumes:
      - control-data:/data
    restart: unless-stopped

volumes:
  control-data:
