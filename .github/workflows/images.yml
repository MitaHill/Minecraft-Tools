name: Server build

on:
  push:
    branches: [main]
    tags:
      - '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-[1-9]*'
      - 'dev-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-[1-9]*'
    # 标签推送不受 paths 过滤，发布标签仍会触发 publish。
    paths: ['control/**', 'node/**', 'deploy/agent/**', '.github/workflows/images.yml']
  pull_request:
    paths: ['control/**', 'node/**', 'deploy/agent/**', '.github/workflows/images.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'
      - run: uv sync --project control --locked
      - name: Test Control Server
        run: PYTHONPATH=control uv run --project control --no-sync python -m unittest discover -s control/tests -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: control/web/package-lock.json
      - run: npm --prefix control/web ci
      - run: npm --prefix control/web run build

  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check agent deploy script
        run: |
          bash -n deploy/agent/deploy.sh
          bash deploy/agent/deploy.sh --self-test
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: node/go.mod
      - name: Test FRP Agent
        run: go test ./...
        working-directory: node
      - name: Check agent version injection
        run: |
          go build -trimpath -ldflags "-X main.version=test-version" -o /tmp/frp-agent .
          test "$(/tmp/frp-agent version)" = "test-version"
        working-directory: node
      - name: Check agent Docker image version
        run: |
          docker build --build-arg VERSION=ci-version -t minecrafttools-frp-agent:ci node
          test "$(docker run --rm --entrypoint /usr/local/bin/frp-agent minecrafttools-frp-agent:ci version)" = "ci-version"

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'
      - name: Lint Python
        run: uvx --from ruff==0.13.2 ruff check control

  build:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: control, context: control, image: minecrafttools-control}
          - {name: frp-agent, context: node, image: minecrafttools-frp-agent}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: false
          platforms: linux/amd64
          tags: ${{ matrix.image }}:ci

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [control, node]
    runs-on: ubuntu-24.04
    environment: dockerhub-publish
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve image version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME#dev-}
          tag=${tag%-images}
          [[ "$tag" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[1-9][0-9]*$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Check Docker Hub configuration
        shell: bash
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          [[ -n "$NAMESPACE" ]] || { echo "::error::Set dockerhub-publish variable DOCKERHUB_NAMESPACE"; exit 1; }
          [[ -n "$USERNAME" ]] || { echo "::error::Set dockerhub-publish variable DOCKERHUB_USERNAME"; exit 1; }
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push images
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          set -euo pipefail
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            -t "$NAMESPACE/minecrafttools-control:$TAG" control
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$TAG" \
            -t "$NAMESPACE/minecrafttools-frp-agent:$TAG" node
      - name: Verify published platforms
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          set -euo pipefail
          for image in minecrafttools-control minecrafttools-frp-agent; do
            manifest=$(docker buildx imagetools inspect "$NAMESPACE/$image:$TAG")
            grep -q 'linux/amd64' <<<"$manifest" || { echo "::error::$image is missing linux/amd64"; exit 1; }
            grep -q 'linux/arm64' <<<"$manifest" || { echo "::error::$image is missing linux/arm64"; exit 1; }
          done
