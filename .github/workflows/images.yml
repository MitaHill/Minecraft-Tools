name: Container images

on:
  push:
    branches: [main]
    tags:
      - '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-[1-9]*'
      - 'dev-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-[1-9]*'
  pull_request:
    paths: ['control/**', 'node/**', '.github/workflows/images.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: control, context: control, image: minecrafttools-control}
          - {name: frp-agent, context: node, image: minecrafttools-frp-agent}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: false
          platforms: linux/amd64
          tags: ${{ matrix.image }}:ci

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: dockerhub-publish
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Check Docker Hub configuration
        shell: bash
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          [[ -n "$NAMESPACE" ]] || { echo "::error::Set dockerhub-publish variable DOCKERHUB_NAMESPACE"; exit 1; }
          [[ -n "$USERNAME" ]] || { echo "::error::Set dockerhub-publish variable DOCKERHUB_USERNAME"; exit 1; }
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push images
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          set -euo pipefail
          tag=${TAG#dev-}
          for spec in minecrafttools-control:control minecrafttools-frp-agent:node; do
            image=${spec%%:*}
            context=${spec##*:}
            docker buildx build --push --platform linux/amd64,linux/arm64 \
              -t "$NAMESPACE/$image:$tag" "$context"
          done
      - name: Verify published platforms
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          set -euo pipefail
          tag=${TAG#dev-}
          for image in minecrafttools-control minecrafttools-frp-agent; do
            manifest=$(docker buildx imagetools inspect "$NAMESPACE/$image:$tag")
            grep -q 'linux/amd64' <<<"$manifest" || { echo "::error::$image is missing linux/amd64"; exit 1; }
            grep -q 'linux/arm64' <<<"$manifest" || { echo "::error::$image is missing linux/arm64"; exit 1; }
          done
