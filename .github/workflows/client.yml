name: Client build

on:
  pull_request:
    paths: ['client/**', 'launcher/**', 'control/**', 'node/**', '.github/workflows/client.yml']
  push:
    branches: [main]
    tags:
      - '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-[1-9]*'
      - 'dev-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-[1-9]*'
      - '!*-images'
    paths: ['client/**', 'launcher/**', 'control/**', 'node/**', '.github/workflows/client.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      frp-tag: ${{ steps.metadata.outputs.frp-tag }}
      version: ${{ steps.metadata.outputs.version }}
      channel: ${{ steps.metadata.outputs.channel }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          frp_tag=$(python3 client/scripts/fetch_frpc.py --latest-tag)
          echo "frp-tag=$frp_tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python3 - <<'PY'
          import os
          import re
          from datetime import date

          tag = os.environ['GITHUB_REF_NAME']
          match = re.fullmatch(r'(dev-)?([0-9]{4}-[0-9]{2}-[0-9]{2})-([1-9][0-9]*)', tag)
          if not match or int(match[3]) > 4294967295:
              raise SystemExit('Invalid release tag')
          date.fromisoformat(match[2])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={match[2]}-{match[3]}', file=output)
              print('channel=dev' if match[1] else 'channel=stable', file=output)
          PY
          else
            echo "version=ci-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate release configuration
        if: github.ref_type == 'tag'
        shell: bash
        env:
          CONTROL_URL: ${{ vars.MINECRAFTTOOLS_CONTROL_URL }}
          PUBLIC_KEYS: ${{ vars.MINECRAFTTOOLS_RELEASE_PUBLIC_KEYS }}
          KEY_ID: ${{ vars.MINECRAFTTOOLS_RELEASE_KEY_ID }}
        run: |
          set -euo pipefail
          [[ -n "$CONTROL_URL" ]] || { echo "::error::Set repository variable MINECRAFTTOOLS_CONTROL_URL"; exit 1; }
          [[ -n "$PUBLIC_KEYS" ]] || { echo "::error::Set repository variable MINECRAFTTOOLS_RELEASE_PUBLIC_KEYS"; exit 1; }
          [[ -n "$KEY_ID" ]] || { echo "::error::Set repository variable MINECRAFTTOOLS_RELEASE_KEY_ID"; exit 1; }

  control:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'
      - run: uv sync --project control --locked
      - name: Test Control Server
        run: PYTHONPATH=control uv run --project control --no-sync python -m unittest discover -s control/tests -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: control/web/package-lock.json
      - run: npm --prefix control/web ci
      - run: npm --prefix control/web run build

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'
      - name: Lint Python
        run: uvx --from ruff==0.13.2 ruff check .
      - name: Check shell scripts
        run: sh -n client/scripts/native/install.sh client/scripts/native/uninstall.sh

  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: node/go.mod
      - name: Test FRP Agent
        run: go test ./...
        working-directory: node

  release-nodes:
    needs: prepare
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare.outputs.channel }}
    steps:
      - name: Record the published node catalog
        env:
          MINECRAFTTOOLS_NODES_TOML: ${{ vars.MINECRAFTTOOLS_NODES_TOML }}
        run: |
          set -euo pipefail
          if [[ -z "$MINECRAFTTOOLS_NODES_TOML" ]]; then
            echo "::error::Set MINECRAFTTOOLS_NODES_TOML in the release channel environment."
            exit 1
          fi
          printf '%s\n' "$MINECRAFTTOOLS_NODES_TOML" > "$RUNNER_TEMP/release-nodes.toml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-nodes
          path: ${{ runner.temp }}/release-nodes.toml
          if-no-files-found: error

  build:
    needs: [prepare, release-nodes]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.release-nodes.result == 'success' || needs.release-nodes.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.system }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, system: windows, arch: amd64, binary: frpc.exe}
          - {runner: windows-11-arm, system: windows, arch: arm64, binary: frpc.exe}
          - {runner: macos-15, system: darwin, arch: arm64, binary: frpc}
          - {runner: macos-15-intel, system: darwin, arch: amd64, binary: frpc}
          - {runner: ubuntu-24.04, system: linux, arch: amd64, binary: frpc}
          - {runner: ubuntu-24.04-arm, system: linux, arch: arm64, binary: frpc}
    env:
      FRP_TAG: ${{ needs.prepare.outputs.frp-tag }}
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      TARGET_OS: ${{ matrix.system }}
      TARGET_ARCH: ${{ matrix.arch }}
      FRPC: client/build/frp/${{ matrix.binary }}
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'
          working-directory: client
      - if: matrix.system == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1-dev pkg-config
      - run: uv sync --project client --locked --extra build
      - run: uv run --project client --no-sync python -m unittest discover -s client/tests -v
      - name: Test Launcher installation and rollback
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          cargo +stable test --locked --manifest-path launcher/Cargo.toml
      - name: Build Launcher
        shell: bash
        env:
          MINECRAFTTOOLS_VERSION: ${{ needs.prepare.outputs.version }}
          MINECRAFTTOOLS_RELEASE_PUBLIC_KEYS: ${{ vars.MINECRAFTTOOLS_RELEASE_PUBLIC_KEYS }}
          MINECRAFTTOOLS_CONTROL_URL: ${{ vars.MINECRAFTTOOLS_CONTROL_URL }}
        run: |
          set -euo pipefail
          [ -n "${MINECRAFTTOOLS_RELEASE_PUBLIC_KEYS:-}" ] || unset MINECRAFTTOOLS_RELEASE_PUBLIC_KEYS
          [ -n "${MINECRAFTTOOLS_CONTROL_URL:-}" ] || unset MINECRAFTTOOLS_CONTROL_URL
          cargo +stable build --locked --release --manifest-path launcher/Cargo.toml --bin launcher
      - name: Verify Launcher needs no VC++ runtime
        if: matrix.system == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'launcher/target/release/launcher.exe'
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          $needed = @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll') |
            Where-Object { $text.Contains($_, [StringComparison]::OrdinalIgnoreCase) }
          if ($needed) { throw "Launcher still imports the VC++ runtime: $($needed -join ', ')" }
      - name: Fetch verified frpc
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --project client --no-sync python client/scripts/fetch_frpc.py --tag "$FRP_TAG" --os "$TARGET_OS" --arch "$TARGET_ARCH" --output client/build/frp
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: github.ref_type == 'tag'
        with:
          name: release-nodes
          path: ${{ runner.temp }}/release-nodes
      - name: Package and smoke test
        shell: bash
        env:
          NODE_CATALOG_DIR: ${{ runner.temp }}/release-nodes
        run: |
          set -euo pipefail
          build=(uv run --project client --no-sync python client/scripts/build.py --frpc "$FRPC" --version "$BUILD_VERSION")
          # macOS runners still ship bash 3.2, where an empty array trips `set -u`.
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            build+=(--nodes-file "$NODE_CATALOG_DIR/release-nodes.toml")
          fi
          "${build[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minecrafttools-${{ matrix.system }}-${{ matrix.arch }}
          path: client/dist/artifacts/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launcher-${{ matrix.system }}-${{ matrix.arch }}
          path: launcher/target/release/launcher*
          if-no-files-found: error

  installers:
    if: github.ref_type == 'tag'
    needs: [prepare, build]
    runs-on: ${{ matrix.runner }}
    name: installer ${{ matrix.system }} / ${{ matrix.arch }}
    environment: release-signing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, system: windows, arch: amd64}
          - {runner: windows-11-arm, system: windows, arch: arm64}
          - {runner: macos-15, system: darwin, arch: arm64}
          - {runner: macos-15-intel, system: darwin, arch: amd64}
          - {runner: ubuntu-24.04, system: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, system: linux, arch: arm64}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: minecrafttools-${{ matrix.system }}-${{ matrix.arch }}
          path: downloaded
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: launcher-${{ matrix.system }}-${{ matrix.arch }}
          path: downloaded
      - name: Install WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2 || dotnet tool update --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '6.0.x'
      - name: Install makeself and runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1
      - name: Package installer
        shell: bash
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          update=$(ls "downloaded/MinecraftTools-update-${VERSION}-${{ matrix.system }}-${{ matrix.arch }}.tar.gz")
          launcher=downloaded/launcher
          extra=""
          if [ "${{ matrix.system }}" = windows ]; then
            launcher=downloaded/launcher.exe
            extra="--wix wix"
          elif [ "${{ matrix.system }}" = linux ]; then
            extra="--makeself makeself"
          elif [ -n "${MACOS_SIGNING_IDENTITY:-}" ]; then
            extra="--mac-identity $MACOS_SIGNING_IDENTITY"
          fi
          "$PYTHON" client/scripts/package_desktop.py --launcher "$launcher" --update "$update" \
            --channel "$CHANNEL" --output-directory client/dist/installers $extra
      - name: Smoke test installed entry (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MINECRAFTTOOLS_DATA_ROOT: ${{ runner.temp }}/mtdata
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem client/dist/installers/*.msi | Select-Object -First 1
          if (-not $msi) { throw 'No MSI produced' }
          $log = Join-Path $env:RUNNER_TEMP 'msi-install.log'
          $arguments = @('/i', "`"$($msi.FullName)`"", '/qn', '/norestart', '/L*v', "`"$log`"")
          $code = (Start-Process msiexec -ArgumentList $arguments -Wait -PassThru).ExitCode
          if ($code -notin 0, 3010) { Get-Content $log -Tail 60; throw "MSI install failed: $code" }
          $launcher = Join-Path $env:LOCALAPPDATA 'Programs\MinecraftTools\MinecraftToolsLauncher.exe'
          $proc = Start-Process $launcher -ArgumentList @('--smoke-test', '--local-fixture') -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Get-ChildItem "$env:MINECRAFTTOOLS_DATA_ROOT\logs" -ErrorAction SilentlyContinue | Get-Content -Tail 40
            throw "Launcher smoke failed: $($proc.ExitCode)"
          }
          $code = (Start-Process msiexec -ArgumentList @('/x', "`"$($msi.FullName)`"", '/qn', '/norestart') -Wait -PassThru).ExitCode
          if ($code -notin 0, 3010) { throw "MSI uninstall failed: $code" }
      - name: Smoke test installed entry (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MINECRAFTTOOLS_DATA_ROOT: ${{ runner.temp }}/mtdata
        run: |
          set -euo pipefail
          dmg=$(ls client/dist/installers/*.dmg)
          mount="$RUNNER_TEMP/dmg"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount" || true' EXIT
          app="$RUNNER_TEMP/MinecraftTools.app"
          ditto "$mount/MinecraftTools.app" "$app"
          codesign --verify --strict "$app"
          "$app/Contents/MacOS/MinecraftToolsLauncher" --smoke-test --local-fixture
      - name: Smoke test installed entry (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          MINECRAFTTOOLS_DATA_ROOT: ${{ runner.temp }}/mtdata
        run: |
          set -euo pipefail
          run=$(ls client/dist/installers/*.run)
          chmod +x "$run"
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          "$run"
          target="$HOME/.local/share/minecrafttools"
          test -x "$target/MinecraftToolsLauncher"
          "$target/MinecraftToolsLauncher" --smoke-test --local-fixture
          "$target/uninstall.sh"
          test ! -e "$target"
          test ! -e "$HOME/.local/bin/minecrafttools"
          test ! -e "$HOME/.local/share/applications/minecrafttools.desktop"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-${{ matrix.system }}-${{ matrix.arch }}
          path: client/dist/installers/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [prepare, build, installers]
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: minecrafttools-*
          merge-multiple: true
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installer-*
          merge-multiple: true
          path: artifacts
      - name: Sign desktop update manifest
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SIGNING_KEY_PEM: ${{ secrets.RELEASE_SIGNING_KEY_PEM }}
          RELEASE_KEY_ID: ${{ vars.MINECRAFTTOOLS_RELEASE_KEY_ID }}
          RELEASE_PUBLIC_KEYS: ${{ vars.MINECRAFTTOOLS_RELEASE_PUBLIC_KEYS }}
          CONTROL_URL: ${{ vars.MINECRAFTTOOLS_CONTROL_URL }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY_PEM" > "$key"
          unset RELEASE_SIGNING_KEY_PEM
          openssl pkey -in "$key" -pubout -outform DER | python3 -c '
          import base64, json, os, sys
          key = sys.stdin.buffer.read()
          if len(key) != 44 or key[:12] != bytes.fromhex("302a300506032b6570032100"):
              raise SystemExit("Expected Ed25519 signing key")
          actual = base64.urlsafe_b64encode(key[12:]).decode().rstrip("=")
          if json.loads(os.environ["RELEASE_PUBLIC_KEYS"]).get(os.environ["RELEASE_KEY_ID"]) != actual:
              raise SystemExit("Signing key does not match the Launcher trust configuration")
          '
          shopt -s nullglob
          updates=(artifacts/MinecraftTools-update-*.tar.gz)
          [[ "${#updates[@]}" -eq 6 ]]
          python3 control/scripts/sign_releases.py --channel "$RELEASE_CHANNEL" \
            --base-url "${CONTROL_URL%/}/releases/artifacts/$RELEASE_CHANNEL" \
            --key-id "$RELEASE_KEY_ID" --private-key "$key" --output artifacts \
            --hours 8760 --matrix-version "$RELEASE_VERSION" "${updates[@]}"
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FRP_TAG: ${{ needs.prepare.outputs.frp-tag }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          cd artifacts
          shopt -s nullglob
          files=(MinecraftTools-*.zip MinecraftTools-*.tar.gz MinecraftTools-*.msi MinecraftTools-*.dmg MinecraftTools-*.run)
          [[ "${#files[@]}" -eq 18 ]]
          for file in "${files[@]}"; do
            printf '%s %s bytes\n' "$file" "$(stat -c %s "$file")"
          done
          sha256sum "${files[@]}" > SHA256SUMS
          flags=()
          if [[ "$RELEASE_CHANNEL" == dev ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" SHA256SUMS "$RELEASE_CHANNEL.json" "${flags[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --notes "Bundled frpc: $FRP_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-channel-manifest
          path: artifacts/${{ needs.prepare.outputs.channel }}.json
          if-no-files-found: error

  deploy-release:
    if: vars.MINECRAFTTOOLS_PUBLISH_MANIFEST == 'true'
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    environment: ssh-publish
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: minecrafttools-*
          merge-multiple: true
          path: assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installer-*
          merge-multiple: true
          path: assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-channel-manifest
          path: manifest
      - name: Publish release to Control Server
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SFTP_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SFTP_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          SFTP_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          SFTP_USER: ${{ vars.DEPLOY_SSH_USER }}
          SFTP_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
          SFTP_DIRECTORY: ${{ vars.DEPLOY_SSH_DIRECTORY }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_CHANNEL" == stable || "$RELEASE_CHANNEL" == dev ]]
          [[ "$SFTP_DIRECTORY" =~ ^/[a-zA-Z0-9_./-]+$ && "$SFTP_DIRECTORY" != *..* ]]
          [[ "$SFTP_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$SFTP_PORT" =~ ^[0-9]+$ && "$SFTP_USER" =~ ^[a-zA-Z0-9_-]+$ ]]

          shopt -s nullglob
          assets=(assets/MinecraftTools-*.zip assets/MinecraftTools-*.tar.gz assets/MinecraftTools-*.msi assets/MinecraftTools-*.dmg assets/MinecraftTools-*.run)
          [[ "${#assets[@]}" -eq 18 ]]
          for asset in "${assets[@]}"; do
            [[ "${asset##*/}" == *"-$RELEASE_VERSION-"* ]]
          done
          (cd assets && sha256sum MinecraftTools-*.zip MinecraftTools-*.tar.gz MinecraftTools-*.msi MinecraftTools-*.dmg MinecraftTools-*.run > SHA256SUMS)

          umask 077
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          printf '%s\n' "$SFTP_KEY" > "$scratch/key"
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$scratch/known_hosts"
          unset SFTP_KEY
          sftp_opts=(-i "$scratch/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$scratch/known_hosts" -P "$SFTP_PORT")
          ssh_opts=(-i "$scratch/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$scratch/known_hosts" -p "$SFTP_PORT")

          channel_dir="$SFTP_DIRECTORY/$RELEASE_CHANNEL"
          artifacts_dir="$channel_dir/artifacts"
          staging="$channel_dir/.staging-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          pending="$SFTP_DIRECTORY/.$RELEASE_CHANNEL-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"

          ssh "${ssh_opts[@]}" -- "$SFTP_USER@$SFTP_HOST" \
            "if [ -d '$channel_dir' ]; then find '$channel_dir' -maxdepth 1 -type d -name '.staging-*' -mtime +1 -exec rm -rf -- {} +; fi"

          {
            printf '%s\n' "-mkdir $channel_dir" "-mkdir $artifacts_dir" "-mkdir $staging" \
              "chmod 755 $channel_dir" "chmod 755 $artifacts_dir" "chmod 755 $staging"
            for asset in "${assets[@]}" assets/SHA256SUMS; do
              printf 'put %s %s/%s\n' "$asset" "$staging" "${asset##*/}"
            done
          } | sftp -b - "${sftp_opts[@]}" -- "$SFTP_USER@$SFTP_HOST"

          ssh "${ssh_opts[@]}" -- "$SFTP_USER@$SFTP_HOST" \
            "cd '$staging' && sha256sum -c SHA256SUMS"

          ssh "${ssh_opts[@]}" -- "$SFTP_USER@$SFTP_HOST" \
            "cd '$staging' && mv -f -- MinecraftTools-* SHA256SUMS '$artifacts_dir/' && rmdir '$staging' && find '$artifacts_dir' -maxdepth 1 -type f -exec chmod 644 -- {} +"

          sftp -b - "${sftp_opts[@]}" -- "$SFTP_USER@$SFTP_HOST" <<EOF
          put manifest/$RELEASE_CHANNEL.json $pending
          chmod 644 $pending
          rename $pending $SFTP_DIRECTORY/$RELEASE_CHANNEL.json
          EOF

          ssh "${ssh_opts[@]}" -- "$SFTP_USER@$SFTP_HOST" \
            "find '$artifacts_dir' -maxdepth 1 -type f ! -name '*-$RELEASE_VERSION-*' -delete"
