[package]
name = "minecrafttools-launcher"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "MinecraftTools 启动器原型"
publish = false

[[bin]]
name = "launcher"
path = "src/main.rs"

[[bin]]
name = "demo-subject"
path = "src/bin/demo_subject.rs"

[dependencies]
base64 = "0.23"
flate2 = "1"
# 只启用 PNG 解码，避免 image-default-formats 带入全部图片格式。
# 版本与 Slint 1.19 使用的 image 保持一致；升级 Slint 时同步检查。
image = { version = "0.25.10", default-features = false, features = ["png"] }
getrandom = "0.3"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = { version = "1.19", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
    "compat-1-2",
] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
tar = "0.4"
tempfile = "3"

[build-dependencies]
slint-build = "1.19"

[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
panic = "abort"
strip = true
