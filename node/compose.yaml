# 本地开发/单段默认模板。生产多段端口由 deploy/agent/deploy.sh 生成。
# Agent 首次启动自动生成 node-id；旧部署仍可保留 NODE_ID 作为兼容覆盖。
services:
  node-net:
    container_name: mitahill-mctools-agent-net
    image: alpine:3.22
    command: ["tail", "-f", "/dev/null"]
    networks: [node]
    ports:
      - "${NODE_BIND_ADDRESS:-0.0.0.0}:${FRP_PUBLIC_CONTROL_PORT:-7000}:7000"
      # 默认容量 16 个端口；Docker 默认每个端口起一个代理进程，内存紧张时调小。
      - "${NODE_BIND_ADDRESS:-0.0.0.0}:${NODE_PORT_START:-30000}-${NODE_PORT_END:-30015}:${NODE_PORT_START:-30000}-${NODE_PORT_END:-30015}"
    cap_drop: [ALL]
    restart: unless-stopped

  firewall:
    container_name: mitahill-mctools-agent-firewall
    image: minecrafttools-node:local
    build:
      context: .
      args:
        VERSION: ${AGENT_VERSION:-dev}
    command: ["firewall-helper"]
    user: "0:10001"
    network_mode: "service:node-net"
    depends_on:
      node-net:
        condition: service_started
        restart: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_PORT_START: ${NODE_PORT_START:-30000}
      NODE_PORT_END: ${NODE_PORT_END:-30015}
    volumes:
      - firewall-data:/var/lib/minecrafttools-firewall
      - firewall-run:/run/minecrafttools
    healthcheck:
      test: ["CMD", "/usr/local/bin/frp-agent", "firewall-health"]
      interval: 3s
      timeout: 2s
      retries: 6
    restart: unless-stopped

  agent:
    container_name: mitahill-mctools-agent
    image: minecrafttools-node:local
    build:
      context: .
      args:
        VERSION: ${AGENT_VERSION:-dev}
    networks: [node]
    depends_on:
      firewall:
        condition: service_healthy
        restart: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      CONTROL_URL: ${CONTROL_URL:?set CONTROL_URL}
      CONTROL_CA_FILE: ${CONTROL_CA_FILE-/run/node-secrets/control-ca.pem}
      CONTROL_CLIENT_CERT_FILE: ${CONTROL_CLIENT_CERT_FILE:-}
      CONTROL_CLIENT_KEY_FILE: ${CONTROL_CLIENT_KEY_FILE:-}
      NODE_NAME: ${NODE_NAME:-}
      NODE_PUBLIC_HOST: ${NODE_PUBLIC_HOST:-}
      FRP_PUBLIC_CONTROL_PORT: ${FRP_PUBLIC_CONTROL_PORT:-7000}
      NODE_PORT_START: ${NODE_PORT_START:-30000}
      NODE_PORT_END: ${NODE_PORT_END:-30015}
      FRPS_ADMIN_URL: http://node-net:7400
      FRPS_ADMIN_USER: ${FRPS_ADMIN_USER:-admin}
      FRPS_ADMIN_PASSWORD_FILE: /run/node-secrets/frps-admin-password
      PLUGIN_LISTEN: 0.0.0.0:9000
    volumes:
      - node-data:/data
      - firewall-run:/run/minecrafttools
      - ${NODE_SECRETS_DIRECTORY:?set NODE_SECRETS_DIRECTORY}:/run/node-secrets:ro
    restart: unless-stopped

  frps:
    container_name: mitahill-mctools-agent-frps
    image: minecrafttools-node:local
    build:
      context: .
      args:
        VERSION: ${AGENT_VERSION:-dev}
    command: ["frps", "-c", "/etc/frp/frps.toml"]
    user: "10001:10001"
    network_mode: "service:node-net"
    depends_on:
      node-net:
        condition: service_started
        restart: true
      firewall:
        condition: service_healthy
        restart: true
      agent:
        condition: service_started
    cap_drop: [ALL]
    volumes:
      - ${FRPS_CONFIG:?set FRPS_CONFIG}:/etc/frp/frps.toml:ro
    restart: unless-stopped

networks:
  node:
    driver: bridge

volumes:
  node-data:
  firewall-data:
  firewall-run:
